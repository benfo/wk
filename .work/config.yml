# wk plan settings. Change them with: wk config set <key> <value>
# workflow.git: branch none|task|project, commit ask|task|check; empty means not chosen yet.
version: 2
store: repo
preset: software
workflow:
  git:
    branch: none
    commit: task
  commit_style: one short line, no body, no attribution
  checks:
    quick: go vet ./... && go test ./internal/app
    full: go vet ./... && go test ./...
  tracker:
tags: [bug, cli, docs, perf, quick, skill, store cli, ui, ux]
reviewed: '2026-11-19'
setup:
  AGENTS.md: da39a3ee5e6b
